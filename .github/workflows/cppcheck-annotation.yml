name: cppcheck-annotations
on:
  workflow_dispatch:
jobs:
  cppcheck-job:
    name: Run Cppcheck Analyse
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run cppcheck-annotation-action
        uses: Konstantin343/cppcheck-annotation-action@v1.1
        with:
          std: 'c++14'
          platform: 'unix64'
          log-level: 'verbose'
          action-fail-level: 'failure,warning,error'

      - name: Annotate lines with errors
        if: always()                              
        uses: yuzutech/annotations-action@v0.5.0
        with:
          repo-token: "${{ secrets.ALPS }}"
          title: 'Results of CppCheck'
          input: 'annotations.json'
